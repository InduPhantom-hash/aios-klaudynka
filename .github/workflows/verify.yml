name: Verify fresh installation and local RAG
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r vault-template/_skrypty/requirements-rag.txt
      - run: python -m unittest discover -s tests -v
      - run: python vault-template/_skrypty/aios_backpass/tests/run_all_tests.py
      - run: python tools/validate_release.py
